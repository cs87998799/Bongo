name: Bongo APK Auto Detect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect latest APK link
        run: |
          BASE="https://bongo.rayenda.com/storage/apk/bongo_live_tv"

          # channels.json na thakle banay nibe
          [ -f channels.json ] || echo '{"version":"2.0.8","apk_url":""}' > channels.json

          CUR=$(jq -r '.version // "2.0.8"' channels.json)
          IFS=. read MA MI PA <<< "$CUR"
          LATEST="$CUR"

          exists() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -r 0-0 -A "Mozilla/5.0" "${BASE}_$1.apk")
            [ "$code" = "200" ] || [ "$code" = "206" ]
          }

          for p in $(seq $((PA+1)) $((PA+20))); do
            exists "$MA.$MI.$p" && LATEST="$MA.$MI.$p"
          done
          for m in $(seq $((MI+1)) $((MI+3))); do
            for p in $(seq 0 10); do
              exists "$MA.$m.$p" && LATEST="$MA.$m.$p"
            done
          done
          for p in $(seq 0 5); do
            exists "$((MA+1)).0.$p" && LATEST="$((MA+1)).0.$p"
          done

          echo "Current: $CUR  Latest: $LATEST"

          jq --arg v "$LATEST" \
             --arg u "${BASE}_${LATEST}.apk" \
             --arg t "$(date -u +%FT%TZ)" \
             '.version=$v | .apk_url=$u | .updated_at=$t' \
             channels.json > tmp.json && mv tmp.json channels.json

      - name: Download and inspect APK
        continue-on-error: true
        run: |
          URL=$(jq -r .apk_url channels.json)
          curl -sL -A "Mozilla/5.0" -o bongo.apk "$URL"
          ls -lh bongo.apk
          rm -rf apk_out && mkdir apk_out
          unzip -q bongo.apk -d apk_out

          {
            echo "=== APK URL: $URL ==="
            echo; echo "=== assets ==="
            ls -R apk_out/assets 2>/dev/null | head -100
            echo; echo "=== stream / json urls ==="
            grep -raoE "https?://[A-Za-z0-9./_?=&%:-]+\.(m3u8|mpd|json|php)" apk_out | sort -u | head -100
            echo; echo "=== api urls in dex ==="
            strings apk_out/classes*.dex | grep -E "https?://" | grep -Ei "api|channel|live|bongo" | sort -u | head -100
          } | tee inspect_report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: inspect-report
          path: inspect_report.txt
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --cached --quiet || (git commit -m "Update Bongo APK link" && git push)
