name: Export Bongo Live TV M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Firebase channels to M3U
        run: python export_bongo_m3u.py
      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bongo_live_tv.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update Bongo Live TV M3U"
            git push
          fi
