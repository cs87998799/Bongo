
name: Nova TV Stream Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nova-tv-detector
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: pip install requests

      - name: Check Files
        run: |
          ls -la
          test -f detector.py

      - name: Run Stream Detector
        run: python -u detector.py

      - name: Validate JSON
        run: python -m json.tool found-links.json > /dev/null

      - name: Commit JSON Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add found-links.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Nova TV streams"
            git push
          fi
