name: Maruf TV M3U Detector

on:
  workflow_dispatch:
  schedule:
    # 14:00 UTC = 20:00 Bangladesh time
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run detector
        run: python detect_m3u.py

      - name: Commit scan reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detected_links.json report.txt
          git diff --cached --quiet || git commit -m "Update Maruf TV scan report"
          git push
