
name: Rangdhonu M3U Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: rangdhonu-m3u-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run M3U Detector
        run: |
          python detector.py

      - name: Validate JSON
        run: |
          python -m json.tool found-links.json > /dev/null
          echo "JSON validation successful"

      - name: Upload Detection Report
        uses: actions/upload-artifact@v4
        with:
          name: rangdhonu-m3u-results
          path: found-links.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add found-links.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Rangdhonu M3U results"

          git fetch origin "${GITHUB_REF_NAME}"

          git rebase "origin/${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Results pushed successfully."
