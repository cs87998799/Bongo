
name: Rangdhonu M3U Link Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Rangdhonu scanner
        run: python rangdhonu_scan.py

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rangdhonu_report.json rangdhonu.m3u

          if git diff --cached --quiet; then
            echo "No changes in scan results."
          else
            git commit -m "Update Rangdhonu playlist scan"
            git push
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rangdhonu-scan-results
          path: |
            rangdhonu_report.json
            rangdhonu.m3u
          if-no-files-found: warn
