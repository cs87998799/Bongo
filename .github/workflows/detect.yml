
name: Rangdhonu Browser M3U Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: rangdhonu-browser-detector
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Browser Detector
        run: |
          python detector.py

      - name: Validate JSON
        run: |
          python -m json.tool found-links.json > /dev/null

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: rangdhonu-detection-report
          path: found-links.json
          retention-days: 30

      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add found-links.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Rangdhonu playlist report"

          git fetch origin "${GITHUB_REF_NAME}"

          git rebase "origin/${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
